<!-- Render ```mermaid blocks of the documentation pages as diagrams. -->
<script type="module">
  const blocks = document.querySelectorAll("div.language-mermaid, pre code.language-mermaid");
  if (blocks.length > 0) {
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
    blocks.forEach((block) => {
      const host = block.tagName === "CODE" ? block.parentElement : block;
      const diagram = document.createElement("div");
      diagram.className = "mermaid";
      diagram.textContent = block.textContent;
      host.replaceWith(diagram);
    });
    mermaid.initialize({ startOnLoad: false });
    await mermaid.run({ querySelector: "div.mermaid" });
  }
</script>
